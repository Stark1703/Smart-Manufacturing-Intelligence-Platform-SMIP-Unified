name: CI

on:
  push:
    branches:
      - main
      - integration/smip-unify
  pull_request:
    branches:
      - main
      - integration/smip-unify
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python source
        run: python -m compileall -q databricks examples framework generator streaming tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
